<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#94733A">
<title>Faça seu pedido</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#FBF7F0;--card:#fff;--ink:#2A2229;--muted:#766C77;--line:#E9E2D6;--gold:#94733A;--gold-d:#7A5D2B;--soft:#F4ECDD;--bad:#A8323A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 140px}
header{text-align:center;padding:28px 16px 18px}
header img{max-height:92px;max-width:260px}
.wm{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--gold)}
.sub{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--gold);margin-top:2px}
.lead{color:var(--muted);margin:10px auto 0;max-width:460px}
h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:28px 0 4px;font-weight:800}
.h2s{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.cat{font-weight:700;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:center}
.p.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--soft)}
.ft{width:74px;height:74px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--gold);overflow:hidden}
.ft img{width:100%;height:100%;object-fit:cover}
.p b{display:block;line-height:1.25}
.p .d{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.p .v{font-weight:800;color:var(--gold);margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.qt{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.qt button{width:38px;height:38px;border:0;background:none;font-size:20px;color:var(--gold);cursor:pointer;font-family:inherit}
.qt input{width:54px;height:38px;border:0;text-align:center;font:inherit;font-size:16px;font-weight:700;background:none;-moz-appearance:textfield}
.qt input::-webkit-outer-spin-button,.qt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.btn{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.pri:hover{background:var(--gold-d)}
.btn.sel{background:var(--soft);border-color:var(--gold);color:var(--gold-d)}
.btn:disabled{opacity:.55;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(60,40,10,.08)}
.bar>div{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .t{font-size:13px;color:var(--muted)}
.bar .t b{display:block;font-size:19px;color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(42,34,41,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 4px;font-size:20px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:12px}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.res{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}
.res li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.res ul{list-style:none;margin:6px 0 0;padding:0}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;font-weight:600}
.center{text-align:center;padding:60px 16px;color:var(--muted)}
.ok{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<div class="wrap">
 <header id="hd"></header>
 <main id="main"><div class="center">Carregando o catálogo...</div></main>
 <footer id="ft"></footer>
</div>
<div class="bar" id="bar" hidden><div><div class="t" id="bar-t"></div><button class="btn pri" id="bar-b">Continuar</button></div></div>
<div id="ov"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://shurvutfxgynqmgmkbgv.supabase.co',SB_KEY='sb_publishable_2IFmJsTg7HcQtnQDLLLG-A_bksQpi30',SLUG='sweetka';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fotoOk=f=>/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(f||'');
let sb=null,LOJA=null,V=null,Q={},enviando=false;
const prods=()=>(V&&Array.isArray(V.produtos)?V.produtos:[]);
const sel=tipo=>prods().filter(p=>p.tipo===tipo&&Q[p.id]>0);
const total=()=>sel('encomenda').reduce((s,p)=>s+Q[p.id]*p.preco,0);
function cab(){const c=V||{};
 $('#hd').innerHTML=(fotoOk(c.logo)?`<img src="${c.logo}" alt="${esc(c.marca)}">`:`<div class="wm">${esc(c.marca||'')}</div>${c.sub?`<div class="sub">${esc(c.sub)}</div>`:''}`)+`<p class="lead">Escolha o que deseja e envie o seu pedido. A confirmação, o valor final e o pagamento são combinados pelo WhatsApp.</p>`;
 $('#ft').textContent=[c.instagram,c.whatsapp?'WhatsApp '+c.whatsapp:''].filter(Boolean).join('  ·  ');
 document.title='Faça seu pedido'+(c.marca?' · '+c.marca:'')}
function card(p){const q=Q[p.id]||0;const est=p.tipo==='estacao';
 return`<div class="p ${q?'on':''}" id="p-${esc(p.id)}"><div class="ft">${fotoOk(p.foto)?`<img src="${p.foto}" alt="">`:esc((p.nome||'?').trim()[0]||'?').toUpperCase()}</div>
 <div><b>${esc(p.nome)}</b>${p.desc?`<span class="d">${esc(p.desc)}</span>`:''}
 <div class="row"><span class="v">${est?'a partir de ':''}${brl(p.preco)}</span>
 ${est?`<button class="btn ${q?'sel':''}" data-est="${esc(p.id)}">${q?'Selecionado':'Quero orçamento'}</button>`
 :`<span class="qt"><button data-m="${esc(p.id)}" aria-label="Menos">−</button><input type="number" inputmode="numeric" min="0" max="5000" value="${q||''}" placeholder="0" data-q="${esc(p.id)}" aria-label="Quantidade de ${esc(p.nome)}"><button data-a="${esc(p.id)}" aria-label="Mais">+</button></span>`}</div></div></div>`}
function lista(){const enc=prods().filter(p=>p.tipo==='encomenda'),est=prods().filter(p=>p.tipo==='estacao');
 if(!enc.length&&!est.length){$('#main').innerHTML='<div class="center">O catálogo está sendo atualizado. Volte em breve.</div>';return}
 const cats=[...new Set(enc.map(p=>p.cat||'Produtos'))];
 $('#main').innerHTML=(enc.length?`<h2>Encomendas</h2><p class="h2s">Informe a quantidade de cada produto.</p>${cats.map(c=>`${cats.length>1?`<div class="cat">${esc(c)}</div>`:''}<div class="grid">${enc.filter(p=>(p.cat||'Produtos')===c).map(card).join('')}</div>`).join('')}`:'')
  +(est.length?`<h2>Estação Gourmet</h2><p class="h2s">Nossa estação vai até a sua festa e serve os convidados por algumas horas. Selecione o pacote para receber um orçamento.</p><div class="grid">${est.map(card).join('')}</div>`:'');
 barra()}
function barra(){const ne=sel('encomenda'),ns=sel('estacao');const n=ne.length+ns.length;$('#bar').hidden=!n;if(!n)return;
 const un=ne.reduce((s,p)=>s+Q[p.id],0);
 $('#bar-t').innerHTML=ne.length?`${un} ${un===1?'unidade':'unidades'}${ns.length?' + orçamento de estação':''}<b>${brl(total())}</b>`:`Orçamento de Estação Gourmet<b>${ns.length} ${ns.length===1?'pacote':'pacotes'}</b>`}
function setQ(id,q){q=Math.max(0,Math.min(5000,Math.round(+q||0)));if(q)Q[id]=q;else delete Q[id];const p=prods().find(x=>x.id===id);const el=document.getElementById('p-'+id);if(p&&el){const foco=document.activeElement&&document.activeElement.dataset.q===id;el.outerHTML=card(p);if(foco){const i=document.querySelector(`[data-q="${CSS.escape(id)}"]`);if(i){i.focus();const v=i.value;i.value='';i.value=v}}}barra()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-m],[data-est]');if(!t)return;
 if(t.dataset.a)setQ(t.dataset.a,(Q[t.dataset.a]||0)+1);else if(t.dataset.m)setQ(t.dataset.m,(Q[t.dataset.m]||0)-1);else setQ(t.dataset.est,Q[t.dataset.est]?0:1)});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.q)setQ(e.target.dataset.q,e.target.value)});
$('#bar-b').onclick=form;
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let MODO='retirada';
function form(){const ne=sel('encomenda'),ns=sel('estacao');if(!ne.length&&!ns.length)return;MODO='retirada';
 $('#ov').innerHTML=`<div class="ov" id="ovb"><div class="sheet" role="dialog" aria-label="Finalizar pedido">
 <h3>Finalizar pedido</h3><div class="note" style="margin-top:0">Preencha seus dados para a gente confirmar com você.</div>
 <div class="res"><b>Resumo</b><ul>${ne.map(p=>`<li><span>${Q[p.id]} × ${esc(p.nome)}</span><span>${brl(Q[p.id]*p.preco)}</span></li>`).join('')}${ns.map(p=>`<li><span>${esc(p.nome)}</span><span>orçamento</span></li>`).join('')}</ul>${ne.length?`<ul><li><b>Total dos produtos</b><b>${brl(total())}</b></li></ul>`:''}</div>
 <label class="f">Seu nome<input type="text" id="f-nome" maxlength="80" autocomplete="name"></label>
 <label class="f">WhatsApp com DDD<input type="tel" id="f-fone" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="(47) 90000-0000"></label>
 <input class="hp" type="text" id="f-site" tabindex="-1" autocomplete="off" aria-hidden="true">
 <div class="two"><label class="f">${ns.length&&!ne.length?'Data da festa':'Para qual dia'}<input type="date" id="f-data" min="${hojeISO()}"></label><label class="f">Horário<input type="time" id="f-hora"></label></div>
 ${ne.length?`<label class="f" style="margin-bottom:0">Como prefere receber</label><div class="seg"><button class="btn sel" id="m-ret" type="button">Retirada</button><button class="btn" id="m-ent" type="button">Entrega por Uber</button></div>
 <div id="f-end-w" hidden><label class="f">Endereço de entrega<input type="text" id="f-end" maxlength="200" autocomplete="street-address"></label><div class="note">A taxa do Uber é por conta da cliente. O valor é informado na confirmação do pedido.</div></div>`:''}
 ${ns.length?`<label class="f">Local da festa<input type="text" id="f-local" maxlength="200" placeholder="Endereço ou nome do salão"></label><label class="f">Número de convidados<input type="number" id="f-conv" min="0" max="5000" inputmode="numeric"></label>`:''}
 <label class="f">Observações<textarea id="f-obs" maxlength="600" placeholder="Sabores, cores, tema, nome do aniversariante..."></textarea></label>
 <div class="err" id="f-err" hidden></div>
 <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" id="f-volta" type="button">Voltar</button><button class="btn pri" id="f-env" type="button" style="flex:1">Enviar pedido</button></div></div></div>`;
 $('#f-volta').onclick=()=>{$('#ov').innerHTML=''};$('#ovb').onclick=e=>{if(e.target.id==='ovb')$('#ov').innerHTML=''};
 if(ne.length){const m=x=>{MODO=x;$('#m-ret').classList.toggle('sel',x==='retirada');$('#m-ent').classList.toggle('sel',x==='entrega');$('#f-end-w').hidden=x!=='entrega'};$('#m-ret').onclick=()=>m('retirada');$('#m-ent').onclick=()=>m('entrega')}
 $('#f-env').onclick=enviar;$('#f-nome').focus()}
function erro(t){const e=$('#f-err');e.textContent=t;e.hidden=false;e.scrollIntoView({block:'nearest'})}
async function enviar(){if(enviando)return;const ne=sel('encomenda'),ns=sel('estacao');
 const nome=$('#f-nome').value.trim(),fone=$('#f-fone').value.trim(),data=$('#f-data').value,hora=$('#f-hora').value,obs=$('#f-obs').value.trim();
 if(nome.length<2)return erro('Informe o seu nome.');
 if(fone.replace(/\D/g,'').length<10)return erro('Informe o seu WhatsApp com DDD.');
 if(!data)return erro('Informe a data desejada.');
 if(ne.length&&MODO==='entrega'&&$('#f-end').value.trim().length<5)return erro('Informe o endereço de entrega.');
 if($('#f-site').value)return fim(); /* campo invisível: só robôs preenchem */
 const base={nome,fone,data,hora,obs};const linhas=[];
 if(ne.length)linhas.push({loja_id:LOJA,dados:{...base,tipo:'encomenda',modo:MODO,endereco:MODO==='entrega'?$('#f-end').value.trim():'',itens:ne.map(p=>({p:p.id,nome:p.nome,q:Q[p.id],v:p.preco})),total:+total().toFixed(2)}});
 if(ns.length)linhas.push({loja_id:LOJA,dados:{...base,tipo:'estacao',modo:'entrega',endereco:$('#f-local').value.trim(),convidados:Math.max(0,Math.round(+$('#f-conv').value||0)),itens:ns.map(p=>({p:p.id,nome:p.nome,q:1,v:p.preco}))}});
 enviando=true;const b=$('#f-env');b.disabled=true;b.textContent='Enviando...';
 try{const r=await sb.from('pedidos_site').insert(linhas);if(r.error)throw r.error;fim()}
 catch(e){enviando=false;b.disabled=false;b.textContent='Enviar pedido';erro('Não foi possível enviar agora. Verifique a internet e tente de novo'+(V&&V.whatsapp?', ou fale com a gente pelo WhatsApp '+V.whatsapp:'')+'.')}}
function fim(){Q={};enviando=false;$('#bar').hidden=true;$('#ov').innerHTML='';window.scrollTo(0,0);
 $('#main').innerHTML=`<div class="center"><div class="ok">✓</div><h3 style="color:var(--ink);margin:0 0 8px;font-size:22px">Pedido enviado</h3><p style="max-width:420px;margin:0 auto 18px">Recebemos o seu pedido. Em breve entramos em contato pelo WhatsApp para confirmar a data, o valor final e a forma de pagamento.</p><button class="btn" id="novo">Fazer outro pedido</button></div>`;
 $('#novo').onclick=lista}
(async()=>{
 if(!window.supabase||!/^https:/.test(SB_URL)){$('#main').innerHTML='<div class="center">Não foi possível carregar a página. Verifique a internet e tente de novo.</div>';return}
 sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'sk-pedir'}});
 try{const r=await sb.from('vitrine').select('loja_id,dados').eq('slug',SLUG).limit(1);if(r.error||!r.data||!r.data[0])throw 0;LOJA=r.data[0].loja_id;V=r.data[0].dados||{};cab();lista()}
 catch(e){$('#main').innerHTML='<div class="center">O catálogo não está disponível no momento. Tente de novo em instantes.</div>'}
})();
</script>
</body>
</html>
